name: Pacote do RPG
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit exato do HTML
        required: true
        type: string
      source_path:
        description: Caminho do HTML
        required: true
        type: string
      filename:
        description: Nome do arquivo para baixar
        required: true
        type: string
      tag:
        description: Tag da versão
        required: true
        type: string
      sha256:
        description: SHA256 esperado
        required: true
        type: string
      prerelease:
        description: Versão de prévia
        required: true
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_REF: ${{ inputs.source_ref }}
      SOURCE_PATH: ${{ inputs.source_path }}
      FILENAME: ${{ inputs.filename }}
      TAG: ${{ inputs.tag }}
      EXPECTED_SHA: ${{ inputs.sha256 }}
      IS_PREVIEW: ${{ inputs.prerelease }}
    steps:
      - name: Verificar e publicar arquivo independente
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FILENAME" =~ ^[a-zA-Z0-9._-]+\.html$ ]]
          [[ "$TAG" =~ ^ecos-do-horizonte-[a-zA-Z0-9._-]+$ ]]
          [[ "$SOURCE_PATH" == jogos/ecos-do-horizonte/* ]]
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/$GH_REPO/$SOURCE_REF/$SOURCE_PATH" --output "$FILENAME"
          printf '%s  %s\n' "$EXPECTED_SHA" "$FILENAME" | sha256sum --check
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILENAME" --clobber
          else
            flags=()
            if [[ "$IS_PREVIEW" == true ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "$FILENAME" --target "$SOURCE_REF" --title "Ecos do Horizonte — $TAG" --notes "RPG 2.5D para celular. Baixe o HTML para jogar. Artes KayKit e áudio Kenney (CC0), incorporados no arquivo. Créditos e controles no menu do jogo." "${flags[@]}"
          fi
