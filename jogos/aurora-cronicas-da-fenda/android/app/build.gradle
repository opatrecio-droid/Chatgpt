apply plugin: 'com.android.application'

// Assinatura do APK. A chave NUNCA fica no repositório (ele é público).
// Procure em: variáveis AURORA_KEYSTORE*, ou assinatura/keystore.properties (ignorado pelo git).
def assinatura = new Properties()
def arquivoAssinatura = rootProject.file('../assinatura/keystore.properties')
if (arquivoAssinatura.exists()) arquivoAssinatura.withInputStream { assinatura.load(it) }
def ksArquivo = System.getenv('AURORA_KEYSTORE') ?: assinatura['storeFile']
def ksSenha = System.getenv('AURORA_KEYSTORE_PASSWORD') ?: assinatura['storePassword']
def ksAlias = System.getenv('AURORA_KEY_ALIAS') ?: assinatura['keyAlias']
def ksSenhaChave = System.getenv('AURORA_KEY_PASSWORD') ?: assinatura['keyPassword'] ?: ksSenha
def temChave = ksArquivo && ksSenha && ksAlias && rootProject.file(ksArquivo.startsWith('/') ? ksArquivo : '../' + ksArquivo).exists()

android {
    namespace = "br.com.aurora.cronicasdafenda"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.aurora.cronicasdafenda"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3072          // 30.7.2 → 3072; some 1 a cada APK publicado, senão o Android não atualiza por cima
        versionName "30.7.2"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (temChave) {
            release {
                storeFile rootProject.file(ksArquivo.startsWith('/') ? ksArquivo : '../' + ksArquivo)
                storePassword ksSenha
                keyAlias ksAlias
                keyPassword ksSenhaChave
            }
        }
    }
    buildTypes {
        release {
            signingConfig temChave ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
